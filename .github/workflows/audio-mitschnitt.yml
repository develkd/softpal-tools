name: Audio-Mitschnitt

on:
  push:
    paths:
      - 'audio-mitschnitt/**'
      - '.github/workflows/audio-mitschnitt.yml'
  pull_request:
    paths:
      - 'audio-mitschnitt/**'
      - '.github/workflows/audio-mitschnitt.yml'
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: audio-mitschnitt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Abhängigkeiten installieren
        run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q

  windows-exe:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: audio-mitschnitt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt pyinstaller
      - name: EXE bauen
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name AudioMitschnitt
          --collect-data soundcard
          audio-mitschnitt.pyw
      - name: EXE hochladen
        uses: actions/upload-artifact@v4
        with:
          name: AudioMitschnitt-windows
          path: audio-mitschnitt/dist/AudioMitschnitt.exe
          if-no-files-found: error
