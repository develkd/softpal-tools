name: Android FitCoach

on:
  push:
    paths:
      - 'fit-coach/**'
      - '.github/workflows/fit-coach.yml'
  pull_request:
    paths:
      - 'fit-coach/**'
      - '.github/workflows/fit-coach.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fit-coach
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit-Tests
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest
      - name: Debug-APK bauen
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: fit-coach-debug-apk
          path: fit-coach/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Testberichte hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fit-coach-test-reports
          path: |
            fit-coach/core/build/reports/tests
            fit-coach/app/build/reports/tests
